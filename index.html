<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironside Gym: memberships and personal trainers</title>
  <meta name="description" content="Join Ironside Gym online. Choose a membership and pick a personal trainer who specializes in your goal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="header"></header>

  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <footer class="site-footer">
    <p class="brand-line"><span class="brand-mark" aria-hidden="true"></span> Ironside Gym</p>
    <p>This is a demo site. Payments are simulated and no money is charged.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h2 id="confirm-title">Are you sure?</h2>
      <p id="confirm-text"></p>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="cancel">Keep it</button>
        <button class="btn btn--danger" value="ok" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
